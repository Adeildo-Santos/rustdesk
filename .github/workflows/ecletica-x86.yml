name: Ecletica Connect 32 bits

# Compila o cliente 32 bits (arvore sciter 1.1.8, jan/2022) ja com a marca Ecletica.
# Roda na nuvem do GitHub (Windows), sem precisar de maquina Windows nossa.

on:
  workflow_dispatch:
  push:
    branches:
      - ecletica-connect-x86

jobs:
  build-x86:
    name: Cliente 32 bits (i686-pc-windows-msvc)
    # windows-2019 esta sendo retirada pelo GitHub: pedir essa imagem em repositorio
    # publico deixa a execucao parada na fila para sempre. A 2022 tem o mesmo LLVM,
    # o mesmo MSVC e sobe na hora.
    runs-on: windows-2022
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1      # a versao sai do Cargo.toml (gen_version), nao do git

      - name: Rust 1.58.1 (epoca da arvore) + alvo 32 bits
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.58.1
          targets: i686-pc-windows-msvc

      # O cargo de 2022 usa a biblioteca interna de git, que engasga ao buscar
      # dependencias de repositorio (dava "object not found" na confy, mesmo com o
      # commit existindo). Mandando usar o git de linha de comando, a busca funciona.
      - name: Preparar o cargo
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE ".cargo"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @"
          [net]
          git-fetch-with-cli = true
          retry = 5
          "@ | Set-Content -Encoding ascii (Join-Path $dir "config.toml")
          Get-Content (Join-Path $dir "config.toml")

      # O build (raiz, libs/scrap e magnum-opus) precisa das bibliotecas de audio e
      # video compiladas e apontadas por VCPKG_ROOT; sem elas para com "NotPresent".
      - name: vcpkg — bibliotecas de audio e video (32 bits)
        shell: pwsh
        run: |
          $raiz = $env:VCPKG_INSTALLATION_ROOT
          if (-not $raiz) { throw "vcpkg nao encontrado nesta imagem do Windows" }
          "VCPKG_ROOT=$raiz" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          & "$raiz\vcpkg" install libvpx libyuv opus --triplet x86-windows-static --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "falhou ao instalar as bibliotecas no vcpkg" }

      - name: Guardar o vcpkg em cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x86-windows-static-v1

      # O bindgen 0.59 (2021) usa o libclang da maquina; com o clang novo do runner
      # ele morre em "LexError" ao gerar as ligacoes do libvpx. Pina o LLVM da epoca.
      - name: LLVM da epoca (bindgen de 2022 com clang novo quebra)
        shell: pwsh
        run: |
          choco install llvm --version=12.0.1 --allow-downgrade --no-progress -y 2>&1 | Out-String | Write-Host
          $p = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$p\libclang.dll")) { throw "LLVM 12 nao ficou em $p" }
          "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "libclang: $p\libclang.dll"

      - name: Biblioteca do sciter (32 bits)
        shell: pwsh
        run: |
          # Endereco fixado num commit de 2022 (epoca da arvore): na pasta de hoje o
          # arquivo mudou de nome (x86 -> x32) e o endereco antigo dava 404.
          $u = "https://raw.githubusercontent.com/c-smile/sciter-sdk/9f1724a45f5a/bin.win/x32/sciter.dll"
          Invoke-WebRequest -Uri $u -OutFile sciter.dll
          $b = [IO.File]::ReadAllBytes("sciter.dll")
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          "sciter.dll: $($b.Length) bytes · machine=0x{0:x}" -f $machine
          if ($machine -ne 0x14c) { throw "a sciter.dll baixada nao e 32 bits" }

      # O crate da libsodium (0.2.7) escolhe a biblioteca pre-construida pela arquitetura da
      # MAQUINA (x64) em vez da do ALVO (32 bits). O linker entao nao acha os simbolos do
      # sodium e a rodada morre com LNK2019/LNK2000. Dentro do proprio crate existe a pasta
      # Win32 (32 bits) — basta apontar SODIUM_LIB_DIR para ela.
      # (NAO usar SODIUM_STATIC: o build.rs aborta dizendo que foi substituido por SODIUM_SHARED.)
      - name: libsodium de 32 bits (o crate pega a de 64 sozinho)
        shell: pwsh
        run: |
          $cat = Join-Path $env:USERPROFILE ".cargo\registry\src"
          $alvo = "libsodium-sys-0.2.7\msvc\Win32\Release\v142\libsodium.lib"
          $lib = Get-ChildItem $cat -Directory |
            ForEach-Object { Join-Path $_.FullName $alvo } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lib) { throw "nao achei a libsodium de 32 bits (Win32) no crate" }
          $dir = Split-Path $lib -Parent
          "SODIUM_LIB_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "libsodium de 32 bits: $dir\libsodium.lib"

      - name: Compilar
        shell: pwsh
        env:
          # o cargo de 2022 usa a biblioteca interna de git e nao acha a confy;
          # com esta variavel ele chama o git do sistema, que baixa sem problema.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_NET_RETRY: "5"
        run: |
          cargo build --release --target i686-pc-windows-msvc 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { Get-Content build.log -Tail 120; throw "falhou a compilacao" }

      - name: Conferir o binario (tem que ser 32 bits e com a nossa marca)
        shell: pwsh
        run: |
          $f = "target/i686-pc-windows-msvc/release/rustdesk.exe"
          if (!(Test-Path $f)) { Get-Content build.log -Tail 120; throw "nao gerou o executavel" }
          Get-Item $f | Select-Object Name, Length
          $b = [IO.File]::ReadAllBytes($f)
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          "machine=0x{0:x}" -f $machine
          if ($machine -ne 0x14c) { throw "o executavel nao e 32 bits" }
          $txt = [Text.Encoding]::Unicode.GetString($b)
          if ($txt -notmatch "Ecletica Connect") { throw "a marca nao entrou no executavel" }
          "marca confirmada dentro do executavel"

      - name: Empacotar instalador proprio
        shell: pwsh
        run: |
          Copy-Item "target/i686-pc-windows-msvc/release/rustdesk.exe" "Ecletica Connect.exe" -Force
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress; }
          & $nsis setup.nsi
          if ($LASTEXITCODE -ne 0) { throw "falhou o empacotamento" }
          Get-ChildItem *.exe | Select-Object Name, Length

      - name: Publicar os arquivos
        uses: actions/upload-artifact@v4
        with:
          name: Ecletica-Connect-32bits
          if-no-files-found: error
          path: |
            Ecletica Connect.exe
            sciter.dll
            icon.ico
            Ecletica-Connect-32bits-Setup.exe
            build.log

      # se algo falhar, o log do cargo sobe como arquivo: e' por ele que se descobre
      # o motivo sem precisar abrir a tela do GitHub.
      - name: Publicar o log (quando falha)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: log-do-build-32bits
          if-no-files-found: warn
          path: |
            build.log
            *.log
